name: Build APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out the project
        uses: actions/checkout@v5

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up the Android SDK
        uses: android-actions/setup-android@v3

      - name: Set up Gradle 8.7
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Find the Gradle project
        id: prep
        run: |
          set -e
          echo "--- repository root ---"
          ls -la

          if [ -f settings.gradle ] || [ -f settings.gradle.kts ]; then
            dir="."
          else
            if ! find . -maxdepth 4 -name settings.gradle -print -quit | grep -q .; then
              z=$(find . -maxdepth 1 -name '*.zip' -print -quit)
              if [ -n "$z" ]; then
                echo "found archive $z - unzipping it"
                unzip -q -o "$z" -d .
              fi
            fi
            found=$(find . -maxdepth 4 -name settings.gradle -print -quit)
            if [ -z "$found" ]; then
              echo "::error::settings.gradle was not found anywhere. Upload the CONTENTS of the project (settings.gradle, build.gradle, gradle.properties, app/, README.md) to the repository root."
              exit 1
            fi
            dir=$(dirname "$found")
          fi

          echo "using Gradle project directory: $dir"
          ls -la "$dir"
          echo "dir=$dir" >> "$GITHUB_OUTPUT"

      - name: Build debug APK
        run: gradle -p "${{ steps.prep.outputs.dir }}" assembleDebug --no-daemon --stacktrace

      - name: Collect the APK
        run: |
          set -e
          d="${{ steps.prep.outputs.dir }}"
          find "$d/app/build/outputs/apk" -name '*.apk' -print
          mkdir -p out
          cp "$d/app/build/outputs/apk/debug/app-debug.apk" out/coloring-puzzle.apk
          ls -lh out

      - name: Upload the APK
        uses: actions/upload-artifact@v4
        with:
          name: coloring-puzzle-apk
          path: out/coloring-puzzle.apk
          if-no-files-found: error
