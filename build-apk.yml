name: Build APK

# Builds the Android APK in the cloud - nothing to install on your PC.
# After the run, open the run page and download the "coloring-puzzle-apk" artifact.

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out the project
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up the Android SDK
        uses: android-actions/setup-android@v3

      - name: Set up Gradle 8.7
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Build debug APK
        run: gradle assembleDebug --no-daemon --stacktrace

      - name: Rename the APK
        run: |
          mkdir -p out
          cp app/build/outputs/apk/debug/app-debug.apk out/coloring-puzzle.apk
          ls -lh out

      - name: Upload the APK
        uses: actions/upload-artifact@v4
        with:
          name: coloring-puzzle-apk
          path: out/coloring-puzzle.apk
          if-no-files-found: error
